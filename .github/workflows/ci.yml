name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12', '24']
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package checks
        run: npm run check:package

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Smoke-test the packed tarball
        if: matrix.node == '24'
        run: |
          npm pack
          mkdir -p /tmp/ytmkit-smoke
          cd /tmp/ytmkit-smoke
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/ytmkit-*.tgz
          npx --no-install ytmkit --version
