name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          node -e "const p = require('./package.json'); const tag = process.env.GITHUB_REF_NAME; if (tag !== 'v' + p.version) { console.error('Release tag ' + tag + ' does not match package version ' + p.version); process.exit(1); }"

      # No NODE_AUTH_TOKEN: npm uses GitHub OIDC via trusted publishing.
      - name: Publish
        run: npm publish --access public
